name: Sealed retained native diagnostic
on:
  push:
    branches: ['prepare/gill-protected-mac22-20261014']
    paths: ['.github/workflows/gill-retained-native-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: sealed-native-acceptance
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'twennieofficial-debug/gillproduction-plugins' && github.event_name == 'push' && github.ref == 'refs/heads/prepare/gill-protected-mac22-20261014'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      max-parallel: 1
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install generic authenticated transport
        shell: bash
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/native-host-ci/output"
          cat > "$RUNNER_TEMP/native-host-ci/transport.mjs" <<'GENERIC_0'
          // Generic bounded transport. No project source, credentials, shell evaluation or dependencies.
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {pipeline} from 'node:stream/promises';
          import {Transform} from 'node:stream';
          import assert from 'node:assert/strict';
          export const LIMITS={files:200000,index:32*1024*1024,file:2*1024**3,total:16*1024**3};
          const MAGIC=Buffer.from('GILLENC1');
          function writeAll(fd,bytes){let offset=0;while(offset<bytes.length){const n=fs.writeSync(fd,bytes,offset,bytes.length-offset);assert(n>0);offset+=n;}}
          export const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          export async function hash(file){const h=crypto.createHash('sha256');for await(const b of fs.createReadStream(file))h.update(b);return h.digest('hex');}
          export function safeName(name){assert.equal(typeof name,'string');assert(name.length>0&&name.length<=1024);assert(!/[\\\x00-\x1f:]/.test(name));assert(!name.startsWith('/'));for(const p of name.split('/'))assert(p&&p!=='.'&&p!=='..'&&!/[. ]$/.test(p)&&! /^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(p));return name;}
          export function validateIndex(index,limits=LIMITS){assert(Array.isArray(index)&&index.length<=limits.files);let total=0;const seen=new Set();for(const r of index){safeName(r.path);assert(!seen.has(r.path.toLowerCase()),'duplicate/case alias');seen.add(r.path.toLowerCase());assert(Number.isSafeInteger(r.size)&&r.size>=0&&r.size<=limits.file,'file bound');assert(/^[a-f0-9]{64}$/.test(r.sha256));assert([0o600,0o700].includes(r.mode));total+=r.size;assert(total<=limits.total,'archive bound');}for(const r of index){const p=r.path.split('/');while(p.length>1){p.pop();assert(!seen.has(p.join('/').toLowerCase()),'file/directory collision');}}return total;}
          export function walk(root,prefix=''){const out=[];for(const e of fs.readdirSync(root,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name))){const full=path.join(root,e.name),name=prefix+e.name;assert(!e.isSymbolicLink(),'symlink forbidden');if(e.isDirectory())out.push(...walk(full,name+'/'));else{assert(e.isFile(),'special file forbidden');out.push({path:safeName(name),file:full});}}return out;}
          export async function pack(records,destination){assert(!fs.existsSync(destination));assert(records.length<=LIMITS.files);const index=[];for(const r of records){const s=fs.lstatSync(r.file);assert(s.isFile()&&!s.isSymbolicLink());index.push({path:safeName(r.path),size:s.size,sha256:await hash(r.file),mode:s.mode&0o111?0o700:0o600});}validateIndex(index);const bytes=Buffer.from(JSON.stringify(index));assert(bytes.length<=LIMITS.index);const fd=fs.openSync(destination,'wx',0o600);try{const header=Buffer.alloc(8);header.writeBigUInt64BE(BigInt(bytes.length));writeAll(fd,header);writeAll(fd,bytes);for(let i=0;i<records.length;i++){let n=0;const h=crypto.createHash('sha256');for await(const b of fs.createReadStream(records[i].file)){n+=b.length;assert(n<=index[i].size);h.update(b);writeAll(fd,b);}assert.equal(n,index[i].size);assert.equal(h.digest('hex'),index[i].sha256,'input changed while packing');}}catch(e){fs.closeSync(fd);fs.rmSync(destination,{force:true});throw e;}fs.closeSync(fd);return index;}
          function bounded(max){let size=0;return new Transform({transform(b,e,cb){size+=b.length;cb(size>max?Error('stream size bound'):null,b);}});}
          function keyCheck(key){assert(Buffer.isBuffer(key)&&key.length===32,'AES256 key required');}
          export async function encrypt(input,output,key){keyCheck(key);assert(fs.statSync(input).size<=LIMITS.total+LIMITS.index+8);assert(!fs.existsSync(output));const nonce=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,nonce);cipher.setAAD(MAGIC);fs.writeFileSync(output,Buffer.concat([MAGIC,nonce]),{flag:'wx',mode:0o600});try{await pipeline(fs.createReadStream(input),cipher,fs.createWriteStream(output,{flags:'a'}));fs.appendFileSync(output,cipher.getAuthTag());}catch(e){fs.rmSync(output,{force:true});throw e;}return hash(output);}
          export async function decrypt(input,output,key,expected){keyCheck(key);assert(/^[a-f0-9]{64}$/.test(expected));const n=fs.statSync(input).size;assert(n>=36&&n<=LIMITS.total+LIMITS.index+44,'ciphertext size');assert.equal(await hash(input),expected,'ciphertext pin');assert(!fs.existsSync(output));const fd=fs.openSync(input,'r'),head=Buffer.alloc(20),tag=Buffer.alloc(16);fs.readSync(fd,head,0,20,0);fs.readSync(fd,tag,0,16,n-16);fs.closeSync(fd);assert(head.subarray(0,8).equals(MAGIC));const cipher=crypto.createDecipheriv('aes-256-gcm',key,head.subarray(8));cipher.setAAD(MAGIC);cipher.setAuthTag(tag);try{await pipeline(fs.createReadStream(input,{start:20,end:n-17}),cipher,bounded(LIMITS.total+LIMITS.index+8),fs.createWriteStream(output,{flags:'wx',mode:0o600}));}catch(e){fs.rmSync(output,{force:true});throw e;}}
          export async function extract(input,destination){assert(!fs.existsSync(destination),'fresh extraction directory required');const size=fs.statSync(input).size;assert(size>=8&&size<=LIMITS.total+LIMITS.index+8);const fd=fs.openSync(input,'r');let index,start;try{const h=Buffer.alloc(8);assert.equal(fs.readSync(fd,h,0,8,0),8);const n=Number(h.readBigUInt64BE());assert(Number.isSafeInteger(n)&&n<=LIMITS.index&&n<=size-8);const b=Buffer.alloc(n);assert.equal(fs.readSync(fd,b,0,n,8),n);index=JSON.parse(b);assert.equal(8+n+validateIndex(index),size,'truncation/trailing bytes');start=8+n;}finally{fs.closeSync(fd);}fs.mkdirSync(destination,{mode:0o700});try{for(const r of index){const target=path.join(destination,r.path);fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700});if(r.size)await pipeline(fs.createReadStream(input,{start,end:start+r.size-1}),fs.createWriteStream(target,{flags:'wx',mode:r.mode}));else fs.writeFileSync(target,'',{flag:'wx',mode:r.mode});assert.equal(await hash(target),r.sha256,'content digest');start+=r.size;}return index;}catch(e){fs.rmSync(destination,{recursive:true,force:true});throw e;}}
          GENERIC_0
          cat > "$RUNNER_TEMP/native-host-ci/bootstrap.mjs" <<'GENERIC_1'
          // Public generic authenticated two-input transport. Private overlay supplies all execution details.
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {Readable,Transform} from 'node:stream';import {pipeline} from 'node:stream/promises';import {decrypt,extract,hash,sha,safeName,walk} from './transport.mjs';
          export function capabilities(text,pins){const a=JSON.parse(text);assert(Array.isArray(a)&&a.length===2);assert.deepEqual(a.map(x=>x.name).sort(),['input','nativeARM']);for(const r of a){const u=new URL(r.url);assert(u.protocol==='https:'&&!u.username&&!u.password&&['release-assets.githubusercontent.com','objects.githubusercontent.com'].includes(u.hostname));assert.equal(r.sha256,pins[r.name].sha256);assert.equal(r.size,pins[r.name].size);assert(Number.isSafeInteger(r.size)&&r.size>=36&&r.size<2*1024**3);}return a;}
          export async function open(base,pins,overlayPin,contractPin,key){for(const name of ['input','nativeARM','overlay']){const archive=base+'/'+name+'.archive';try{await decrypt(base+'/'+name+'.gillenc',archive,key,name==='overlay'?overlayPin:pins[name].sha256);await extract(archive,base+'/'+name);}finally{fs.rmSync(archive,{force:true});}}
           const extra=base+'/overlay',root=base+'/input',file=extra+'/native-host-probe-ci/contract.json';assert.equal(await hash(file),contractPin);const c=JSON.parse(fs.readFileSync(file));const m=JSON.parse(fs.readFileSync(root+'/input-manifest.json'));assert.equal(m.sourceSeal,c.baseSourceSeal);assert.equal(sha(Buffer.from(JSON.stringify(m.sourceRecords))),c.baseSourceSeal);
           for(const r of m.sourceRecords){safeName(r.path);assert.equal(await hash(root+'/'+r.path),r.sha256);}for(const r of c.headers){assert(m.sourceRecords.some(x=>x.path===r.path&&x.sha256===r.sha256));}
           assert.deepEqual(walk(extra).map(r=>r.path).sort(),[...c.files.map(r=>r.path),'native-host-probe-ci/contract.json'].sort());for(const r of c.files){safeName(r.path);assert(r.path.startsWith('native-host-probe-ci/'));assert.equal(await hash(extra+'/'+r.path),r.sha256);assert(!fs.existsSync(root+'/'+r.path));fs.mkdirSync(path.dirname(root+'/'+r.path),{recursive:true,mode:0o700});fs.copyFileSync(extra+'/'+r.path,root+'/'+r.path);}fs.copyFileSync(file,root+'/native-host-probe-ci/contract.json');
           for(const b of c.bundles)for(const r of b.files){safeName(r.path);assert.equal(await hash(base+'/nativeARM/'+r.path),r.sha256);}return c;
          }
          export async function main(){const [mode,base,pinsFile,op,cp]=process.argv.slice(2),pins=JSON.parse(fs.readFileSync(pinsFile));if(mode==='download'){for(const r of capabilities(process.env.GILL_INPUT_URL,pins)){const response=await fetch(r.url,{redirect:'error',signal:AbortSignal.timeout(180000)});assert(response.ok&&response.body);let bytes=0;await pipeline(Readable.fromWeb(response.body),new Transform({transform(b,e,cb){bytes+=b.length;cb(bytes>r.size?Error('bound'):null,b);}}),fs.createWriteStream(base+'/'+r.name+'.gillenc',{flags:'wx',mode:0o600}));assert.equal(bytes,r.size);assert.equal(await hash(base+'/'+r.name+'.gillenc'),r.sha256);}}else{assert.equal(mode,'open');const key=Buffer.from(process.env.GILL_KEY||'','base64');try{await open(base,pins,op,cp,key);}finally{key.fill(0);}}}
          if(process.argv[1]&&path.resolve(process.argv[1])===path.join(import.meta.dirname,'bootstrap.mjs'))try{await main();}catch{console.error('Authenticated diagnostic input failed');process.exitCode=1;}
          GENERIC_1
          cat > "$RUNNER_TEMP/native-host-ci/finish.mjs" <<'GENERIC_2'
          import fs from 'node:fs';import {pack,encrypt,walk} from './transport.mjs';
          try{const base=process.argv[2],out=base+'/output/evidence';fs.mkdirSync(out,{recursive:true,mode:0o700});if(fs.existsSync(base+'/driver-private.log'))fs.copyFileSync(base+'/driver-private.log',out+'/workflow-private.log');const records=walk(out).filter(r=>r.path.endsWith('.log')||r.path.endsWith('.sample.txt')||r.path==='checkpoint.json');if(!records.length)throw Error('no evidence');const key=Buffer.from(process.env.GILL_KEY||'','base64');try{await pack(records,base+'/result.archive');await encrypt(base+'/result.archive',base+'/result.gillenc',key);}finally{key.fill(0);fs.rmSync(base+'/result.archive',{force:true});}}catch{console.error('Diagnostic evidence encryption failed');process.exitCode=1;}
          GENERIC_2
          cat > "$RUNNER_TEMP/native-host-ci/pins.json" <<'PUBLIC_PINS'
          {"input":{"sha256":"67025a9f7569bc8dbc0a3b9f77a75a54480b33eb5615ae4139c4f7ac34b927b7","size":1927028205},"nativeARM":{"sha256":"0ba97104f57054f6c6d62669c9465828e9d41300eba7438f9fddb310b7b6796f","size":62406532}}
          PUBLIC_PINS
          touch "$RUNNER_TEMP/native-host-ci/overlay.b64"
      - name: Stage encrypted overlay part 1
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/native-host-ci/overlay.b64" <<'ENCRYPTED_OVERLAY'
          
          ENCRYPTED_OVERLAY
      - name: Stage encrypted overlay part 2
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/native-host-ci/overlay.b64" <<'ENCRYPTED_OVERLAY'
          
          ENCRYPTED_OVERLAY
      - name: Stage encrypted overlay part 3
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/native-host-ci/overlay.b64" <<'ENCRYPTED_OVERLAY'
          
          ENCRYPTED_OVERLAY
      - name: Stage encrypted overlay part 4
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/native-host-ci/overlay.b64" <<'ENCRYPTED_OVERLAY'
          
          ENCRYPTED_OVERLAY
      - name: Stage encrypted overlay part 5
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/native-host-ci/overlay.b64" <<'ENCRYPTED_OVERLAY'
          
          ENCRYPTED_OVERLAY
      - name: Stage encrypted overlay part 6
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/native-host-ci/overlay.b64" <<'ENCRYPTED_OVERLAY'
          
          ENCRYPTED_OVERLAY
      - name: Decode encrypted overlay
        shell: bash
        run: node -e 'const fs=require("fs"),p=process.argv[1];fs.writeFileSync(p+"/overlay.gillenc",Buffer.from(fs.readFileSync(p+"/overlay.b64","utf8").replace(/\s/g,""),"base64"),{mode:384});' "$RUNNER_TEMP/native-host-ci"
      - name: Fetch only bounded single-asset capabilities
        env:
          GILL_INPUT_URL: ${{ secrets.GILL_MAC14_INPUT_URL }}
        shell: bash
        run: node "$RUNNER_TEMP/native-host-ci/bootstrap.mjs" download "$RUNNER_TEMP/native-host-ci" "$RUNNER_TEMP/native-host-ci/pins.json"
      - name: Authenticate original, native slices and encrypted overlay
        env:
          GILL_KEY: ${{ secrets.GILL_MAC14_CI_KEY }}
        shell: bash
        run: node "$RUNNER_TEMP/native-host-ci/bootstrap.mjs" open "$RUNNER_TEMP/native-host-ci" "$RUNNER_TEMP/native-host-ci/pins.json" 1012770823c5c2f79a2f18219e1014d419478cd3c755f52f93c8d7edd51bce21 8f3456a57d7378832f2294e414c963712cf350544bba3a03c77167db02301a9f
      - name: Run bounded diagnostic on disposable hosted machine
        env:
          CI: 'true'
        shell: bash
        run: |
          set +x
          python3 "$RUNNER_TEMP/native-host-ci/input/native-host-probe-ci/driver.py" "$RUNNER_TEMP/native-host-ci" --consent-disposable-ci-account > "$RUNNER_TEMP/native-host-ci/driver-private.log" 2>&1
      - name: Encrypt private diagnostic evidence including failure
        if: always()
        env:
          GILL_KEY: ${{ secrets.GILL_MAC14_CI_KEY }}
        shell: bash
        run: node "$RUNNER_TEMP/native-host-ci/finish.mjs" "$RUNNER_TEMP/native-host-ci"
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-native-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-host-ci/result.gillenc
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
