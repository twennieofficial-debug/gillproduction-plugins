      - name: Run sealed targeted native checks
        timeout-minutes: 330
        env:
          CI: 'true'
          GILL_SYNTHETIC_KEYCHAIN_ISOLATION: 'explicit-isolated-ci-only'
          CXXFLAGS: '-include ${{ runner.temp }}/sealed-native/input/integration/macos-key-attributes-compat.h'
          OBJCXXFLAGS: '-include ${{ runner.temp }}/sealed-native/input/integration/macos-key-attributes-compat.h'
