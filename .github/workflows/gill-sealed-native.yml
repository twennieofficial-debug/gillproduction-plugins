name: Sealed native acceptance
on:
  push:
    branches: ['prepare/gill-protected-mac22-20261014']
    paths: ['.github/workflows/gill-sealed-native.yml']
permissions:
  contents: read
concurrency:
  group: sealed-native-acceptance
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'twennieofficial-debug/gillproduction-plugins' && github.event_name == 'push' && github.ref == 'refs/heads/prepare/gill-protected-mac22-20261014'
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install generic transport
        shell: bash
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/sealed-native"
          cat > "$RUNNER_TEMP/sealed-native/transport.mjs" <<'GILL_BOOTSTRAP_EOF'
          // Generic bounded transport. No project source, credentials, shell evaluation or dependencies.
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {pipeline} from 'node:stream/promises';
          import {Transform} from 'node:stream';
          import assert from 'node:assert/strict';
          export const LIMITS={files:200000,index:32*1024*1024,file:2*1024**3,total:16*1024**3};
          const MAGIC=Buffer.from('GILLENC1');
          function writeAll(fd,bytes){let offset=0;while(offset<bytes.length){const n=fs.writeSync(fd,bytes,offset,bytes.length-offset);assert(n>0);offset+=n;}}
          export const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          export async function hash(file){const h=crypto.createHash('sha256');for await(const b of fs.createReadStream(file))h.update(b);return h.digest('hex');}
          export function safeName(name){assert.equal(typeof name,'string');assert(name.length>0&&name.length<=1024);assert(!/[\\\x00-\x1f:]/.test(name));assert(!name.startsWith('/'));for(const p of name.split('/'))assert(p&&p!=='.'&&p!=='..'&&!/[. ]$/.test(p)&&! /^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(p));return name;}
          export function validateIndex(index,limits=LIMITS){assert(Array.isArray(index)&&index.length<=limits.files);let total=0;const seen=new Set();for(const r of index){safeName(r.path);assert(!seen.has(r.path.toLowerCase()),'duplicate/case alias');seen.add(r.path.toLowerCase());assert(Number.isSafeInteger(r.size)&&r.size>=0&&r.size<=limits.file,'file bound');assert(/^[a-f0-9]{64}$/.test(r.sha256));assert([0o600,0o700].includes(r.mode));total+=r.size;assert(total<=limits.total,'archive bound');}for(const r of index){const p=r.path.split('/');while(p.length>1){p.pop();assert(!seen.has(p.join('/').toLowerCase()),'file/directory collision');}}return total;}
          export function walk(root,prefix=''){const out=[];for(const e of fs.readdirSync(root,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name))){const full=path.join(root,e.name),name=prefix+e.name;assert(!e.isSymbolicLink(),'symlink forbidden');if(e.isDirectory())out.push(...walk(full,name+'/'));else{assert(e.isFile(),'special file forbidden');out.push({path:safeName(name),file:full});}}return out;}
          export async function pack(records,destination){assert(!fs.existsSync(destination));assert(records.length<=LIMITS.files);const index=[];for(const r of records){const s=fs.lstatSync(r.file);assert(s.isFile()&&!s.isSymbolicLink());index.push({path:safeName(r.path),size:s.size,sha256:await hash(r.file),mode:s.mode&0o111?0o700:0o600});}validateIndex(index);const bytes=Buffer.from(JSON.stringify(index));assert(bytes.length<=LIMITS.index);const fd=fs.openSync(destination,'wx',0o600);try{const header=Buffer.alloc(8);header.writeBigUInt64BE(BigInt(bytes.length));writeAll(fd,header);writeAll(fd,bytes);for(let i=0;i<records.length;i++){let n=0;const h=crypto.createHash('sha256');for await(const b of fs.createReadStream(records[i].file)){n+=b.length;assert(n<=index[i].size);h.update(b);writeAll(fd,b);}assert.equal(n,index[i].size);assert.equal(h.digest('hex'),index[i].sha256,'input changed while packing');}}catch(e){fs.closeSync(fd);fs.rmSync(destination,{force:true});throw e;}fs.closeSync(fd);return index;}
          function bounded(max){let size=0;return new Transform({transform(b,e,cb){size+=b.length;cb(size>max?Error('stream size bound'):null,b);}});}
          function keyCheck(key){assert(Buffer.isBuffer(key)&&key.length===32,'AES256 key required');}
          export async function encrypt(input,output,key){keyCheck(key);assert(fs.statSync(input).size<=LIMITS.total+LIMITS.index+8);assert(!fs.existsSync(output));const nonce=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,nonce);cipher.setAAD(MAGIC);fs.writeFileSync(output,Buffer.concat([MAGIC,nonce]),{flag:'wx',mode:0o600});try{await pipeline(fs.createReadStream(input),cipher,fs.createWriteStream(output,{flags:'a'}));fs.appendFileSync(output,cipher.getAuthTag());}catch(e){fs.rmSync(output,{force:true});throw e;}return hash(output);}
          export async function decrypt(input,output,key,expected){keyCheck(key);assert(/^[a-f0-9]{64}$/.test(expected));const n=fs.statSync(input).size;assert(n>=36&&n<=LIMITS.total+LIMITS.index+44,'ciphertext size');assert.equal(await hash(input),expected,'ciphertext pin');assert(!fs.existsSync(output));const fd=fs.openSync(input,'r'),head=Buffer.alloc(20),tag=Buffer.alloc(16);fs.readSync(fd,head,0,20,0);fs.readSync(fd,tag,0,16,n-16);fs.closeSync(fd);assert(head.subarray(0,8).equals(MAGIC));const cipher=crypto.createDecipheriv('aes-256-gcm',key,head.subarray(8));cipher.setAAD(MAGIC);cipher.setAuthTag(tag);try{await pipeline(fs.createReadStream(input,{start:20,end:n-17}),cipher,bounded(LIMITS.total+LIMITS.index+8),fs.createWriteStream(output,{flags:'wx',mode:0o600}));}catch(e){fs.rmSync(output,{force:true});throw e;}}
          export async function extract(input,destination){assert(!fs.existsSync(destination),'fresh extraction directory required');const size=fs.statSync(input).size;assert(size>=8&&size<=LIMITS.total+LIMITS.index+8);const fd=fs.openSync(input,'r');let index,start;try{const h=Buffer.alloc(8);assert.equal(fs.readSync(fd,h,0,8,0),8);const n=Number(h.readBigUInt64BE());assert(Number.isSafeInteger(n)&&n<=LIMITS.index&&n<=size-8);const b=Buffer.alloc(n);assert.equal(fs.readSync(fd,b,0,n,8),n);index=JSON.parse(b);assert.equal(8+n+validateIndex(index),size,'truncation/trailing bytes');start=8+n;}finally{fs.closeSync(fd);}fs.mkdirSync(destination,{mode:0o700});try{for(const r of index){const target=path.join(destination,r.path);fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700});if(r.size)await pipeline(fs.createReadStream(input,{start,end:start+r.size-1}),fs.createWriteStream(target,{flags:'wx',mode:r.mode}));else fs.writeFileSync(target,'',{flag:'wx',mode:r.mode});assert.equal(await hash(target),r.sha256,'content digest');start+=r.size;}return index;}catch(e){fs.rmSync(destination,{recursive:true,force:true});throw e;}}
          GILL_BOOTSTRAP_EOF
          cat > "$RUNNER_TEMP/sealed-native/bootstrap.mjs" <<'GILL_BOOTSTRAP_EOF'
          // Generic public bootstrap; bounded errors only. Never prints filenames, input content or keys.
          import fs from 'node:fs';import path from 'node:path';import {Readable,Transform} from 'node:stream';import {pipeline} from 'node:stream/promises';import assert from 'node:assert/strict';import {decrypt,extract,pack,encrypt,walk,hash,LIMITS} from './transport.mjs';
          let failure='sealed_operation_failed';
          try{const [operation,base,expected,asset]=process.argv.slice(2);assert(base);const root=path.resolve(base);fs.mkdirSync(root,{recursive:true,mode:0o700});
           if(operation==='download'){
            assert(/^[1-9][0-9]*$/.test(asset));let url=process.env.GILL_INPUT_URL||'https://api.github.com/repos/twennieofficial-debug/gillproduction-plugins/releases/assets/'+asset;let response;
            if(process.env.GILL_INPUT_URL){const signed=new URL(url);assert(signed.protocol==='https:'&&!signed.username&&!signed.password&&['release-assets.githubusercontent.com','objects.githubusercontent.com'].includes(signed.hostname));}
            for(let redirects=0;redirects<4;redirects++){const headers={'Accept':'application/octet-stream','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sealed-native-ci'};if(new URL(url).hostname==='api.github.com')headers.Authorization='Bearer '+process.env.GH_TOKEN;response=await fetch(url,{headers,redirect:'manual',signal:AbortSignal.timeout(120000)});if(![301,302,303,307,308].includes(response.status))break;url=new URL(response.headers.get('location'),url).href;const u=new URL(url);if(!['release-assets.githubusercontent.com','objects.githubusercontent.com','github.com'].includes(u.hostname))failure='unexpected_redirect_host';assert(u.protocol==='https:'&&!u.username&&!u.password&&['release-assets.githubusercontent.com','objects.githubusercontent.com','github.com'].includes(u.hostname));}
            if(!response.ok)failure='download_http_'+response.status;assert(response.ok&&response.body);const length=Number(response.headers.get('content-length'));if(length)assert(length<=LIMITS.total+LIMITS.index+44);let bytes=0;await pipeline(Readable.fromWeb(response.body),new Transform({transform(b,e,cb){bytes+=b.length;cb(bytes>LIMITS.total+LIMITS.index+44?Error('bound'):null,b);}}),fs.createWriteStream(path.join(root,'input.gillenc'),{flags:'wx',mode:0o600}));
           }else if(operation==='open'){
            const key=Buffer.from(process.env.GILL_KEY||'','base64'),archive=path.join(root,'input.archive');try{await decrypt(path.join(root,'input.gillenc'),archive,key,expected);await extract(archive,path.join(root,'input'));}finally{key.fill(0);fs.rmSync(archive,{force:true});fs.rmSync(path.join(root,'input.gillenc'),{force:true});}
           }else if(operation==='seal'){
            const key=Buffer.from(process.env.GILL_KEY||'','base64'),archive=path.join(root,'result.archive'),evidence=path.join(root,'output/evidence');fs.mkdirSync(evidence,{recursive:true});if(fs.existsSync(path.join(root,'private.log')))fs.copyFileSync(path.join(root,'private.log'),path.join(evidence,'workflow-private.log'));
            // Refresh only the file inventory: never promote an interrupted stage to accepted.
            const checkpoint=path.join(evidence,'checkpoint.json');if(fs.existsSync(checkpoint)){const m=JSON.parse(fs.readFileSync(checkpoint));m.files=[];for(const r of walk(evidence).filter(r=>r.path!=='checkpoint.json'))m.files.push({path:r.path,sha256:await hash(r.file)});fs.writeFileSync(checkpoint,JSON.stringify(m,null,2));}
            try{await pack(walk(evidence),archive);await encrypt(archive,path.join(root,'result.gillenc'),key);}finally{key.fill(0);fs.rmSync(archive,{force:true});}
           }else throw Error('operation');
          }catch{console.error('Sealed CI operation failed: '+failure+'. No secrets or signed URLs logged.');process.exitCode=1;}
          GILL_BOOTSTRAP_EOF
      - name: Download pinned encrypted input
        env:
          GH_TOKEN: ${{ github.token }}
          GILL_INPUT_URL: ${{ secrets.GILL_MAC14_INPUT_URL }}
        shell: bash
        run: node "$RUNNER_TEMP/sealed-native/bootstrap.mjs" download "$RUNNER_TEMP/sealed-native" 67025a9f7569bc8dbc0a3b9f77a75a54480b33eb5615ae4139c4f7ac34b927b7 640295598
      - name: Authenticate and open input
        env:
          GILL_KEY: ${{ secrets.GILL_MAC14_CI_KEY }}
        shell: bash
        run: node "$RUNNER_TEMP/sealed-native/bootstrap.mjs" open "$RUNNER_TEMP/sealed-native" 67025a9f7569bc8dbc0a3b9f77a75a54480b33eb5615ae4139c4f7ac34b927b7
      - name: Bind reviewed generic evidence driver
        shell: bash
        run: |
          set -eu
          cat > "$RUNNER_TEMP/sealed-native/root-rebind.mjs" <<'GILL_ROOT_REBIND_EOF'
          // Generic public CI housekeeping only; no plugin source, credentials or network.
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import {fileURLToPath} from 'node:url';
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          export function rebind(manifest,baseSeal,oldDriver,newDriver,finalSeal,patches=[],compatSha=null){
           for(const s of [baseSeal,oldDriver,newDriver,finalSeal])assert.match(s,/^[a-f0-9]{64}$/);
           assert.equal(manifest.sourceSeal,baseSeal);
           assert.equal(sha(JSON.stringify(manifest.sourceRecords)),baseSeal);
           assert.equal(manifest.driverSeal,oldDriver);
           const records=manifest.sourceRecords.filter(r=>r.path==='encrypted-ci/driver.mjs');
           assert.equal(records.length,1);assert.equal(records[0].sha256,oldDriver);
           const updated=structuredClone(manifest);
           updated.sourceRecords.find(r=>r.path==='encrypted-ci/driver.mjs').sha256=newDriver;
           const allowed=['protected-mac-manager/native/manager_tests.cpp','protected-mac-manager/native/generate_manager_vectors.mjs','protected-mac-manager/native/macos/manager_cache_macos.cpp','protected-mac-manager/native/macos/manager_main.mm','protected-mac-manager/source-manifest.json'];
           assert.equal(new Set(patches.map(p=>p.path)).size,patches.length);
           for(const p of patches){assert(allowed.includes(p.path));assert.match(p.sha256,/^[a-f0-9]{64}$/);const entries=updated.sourceRecords.filter(r=>r.path===p.path);assert.equal(entries.length,1);assert.equal(entries[0].sha256,p.oldSha256);entries[0].sha256=p.sha256;if(p.path.endsWith('/source-manifest.json')){assert.equal(updated.managerSourceSeal,p.oldSha256);updated.managerSourceSeal=p.sha256;}}
           if(compatSha){assert.match(compatSha,/^[a-f0-9]{64}$/);const compat='root-generic/macos-key-attributes-compat.h';assert(!updated.sourceRecords.some(r=>r.path===compat));updated.sourceRecords.push({path:compat,sha256:compatSha});}
           updated.driverSeal=newDriver;updated.sourceSeal=sha(JSON.stringify(updated.sourceRecords));
           assert.equal(updated.sourceSeal,finalSeal);
           return updated;
          }
          if(process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url)){
           const [mode,root,baseSeal,oldDriver,newDriver,finalSeal,patchFile,compatSha]=process.argv.slice(2);
           const patches=patchFile?JSON.parse(fs.readFileSync(patchFile)):[];
           const file=path.join(root,'input-manifest.json'),driver=path.join(root,'encrypted-ci/driver.mjs');
           const manifest=JSON.parse(fs.readFileSync(file));
           if(mode==='before'){
            assert.equal(sha(fs.readFileSync(driver)),oldDriver);
            rebind(manifest,baseSeal,oldDriver,newDriver,finalSeal,patches,compatSha);
            for(const p of patches)assert.equal(sha(fs.readFileSync(path.join(root,p.path))),p.oldSha256);
           }else{
            assert.equal(mode,'after');assert.equal(sha(fs.readFileSync(driver)),newDriver);
            for(const p of patches){const target=path.join(root,p.path);if(p.path.endsWith('/source-manifest.json')){const m=JSON.parse(fs.readFileSync(target));for(const q of patches.filter(q=>q.path.includes('/native/')))m.sha256[q.path.split('protected-mac-manager/')[1]]=q.sha256;fs.writeFileSync(target,JSON.stringify(m,null,2)+'\n');}else{let text=fs.readFileSync(target,'utf8');for(const edit of p.edits||[p]){const count=edit.count||1;assert([1,2].includes(count));assert.equal(text.split(edit.before).length,count+1);text=text.replaceAll(edit.before,edit.after);}fs.writeFileSync(target,text);}assert.equal(sha(fs.readFileSync(target)),p.sha256);}
            if(compatSha)assert.equal(sha(fs.readFileSync(path.join(root,'root-generic/macos-key-attributes-compat.h'))),compatSha);
            fs.writeFileSync(file,JSON.stringify(rebind(manifest,baseSeal,oldDriver,newDriver,finalSeal,patches,compatSha),null,2));
           }
          }
          GILL_ROOT_REBIND_EOF
          cat > "$RUNNER_TEMP/sealed-native/reviewed-patches.json" <<'GILL_ROOT_PATCHES_EOF'
          [{"path":"protected-mac-manager/native/macos/manager_cache_macos.cpp","oldSha256":"378785e94f256e0a0178bd554e8bb153710c0ccc8460e8057ff8b5784f912a93","sha256":"c953a3d70cbc8df84f22901cbdc1ec8b6b7da2021181843dd136ce5de55b6981","before":"acl_t acl = acl_get_fd_np(fd, ACL_TYPE_EXTENDED);\r\n    if (acl == nullptr) return false;","after":"errno = 0;\r\n    acl_t acl = acl_get_fd_np(fd, ACL_TYPE_EXTENDED);\r\n    if (acl == nullptr) return errno == ENOENT;","count":2},{"path":"protected-mac-manager/native/macos/manager_main.mm","oldSha256":"e39a4760130fb617bbe67954312553fda97f1735906e1a06bd95f313c376019a","sha256":"eae515dd5ddf50327acc9bfc4b42d1845ee2815ffa0c10e42a631e7369736e53","edits":[{"before":"#include <cstdlib>","after":"#include <cstdlib>\n#include <cstdio>\nstatic void smokeProgress(const char* stage){if([[NSProcessInfo processInfo].arguments containsObject:@\"--smoke-test\"]){std::fprintf(stderr,\"GILL_MANAGER_UI_SMOKE %s\\n\",stage);std::fflush(stderr);}}"},{"before":"(void)notification;instanceLock=-1;","after":"(void)notification;smokeProgress(\"launch-finished\");instanceLock=-1;"},{"before":"std::string code,url,id;","after":"std::string code,url,id;smokeProgress(\"worker-start\");"},{"before":"engine=std::make_unique<gill::manager::Engine>","after":"smokeProgress(\"engine-create\");engine=std::make_unique<gill::manager::Engine>"},{"before":"id=engine->deviceId();","after":"id=engine->deviceId();smokeProgress(\"device-ready\");"},{"before":"}catch(const std::exception& error){code=error.what();}","after":"}catch(const std::exception& error){code=error.what();smokeProgress(\"worker-error\");}smokeProgress(\"worker-finished\");"},{"before":"if(id.empty())std::exit(2);[NSApp terminate:nil];","after":"if(id.empty())std::exit(2);smokeProgress(\"terminate-request\");[NSApp terminate:nil];"},{"before":"(void)sender;[timer invalidate];","after":"(void)sender;smokeProgress(\"terminate-delegate\");[timer invalidate];"},{"before":"[NSApp replyToApplicationShouldTerminate:YES];","after":"smokeProgress(\"terminate-reply\");[NSApp replyToApplicationShouldTerminate:YES];"},{"before":"int main(){@autoreleasepool {NSApplication* app=","after":"int main(){@autoreleasepool {smokeProgress(\"main-start\");NSApplication* app="},{"before":"dispatch_async(worker, ^{dispatch_async(dispatch_get_main_queue(), ^{smokeProgress(\"terminate-reply\");[NSApp replyToApplicationShouldTerminate:YES];});});","after":"dispatch_async(worker, ^{CFRunLoopPerformBlock(CFRunLoopGetMain(), (__bridge CFStringRef)NSModalPanelRunLoopMode, ^{smokeProgress(\"terminate-reply\");[NSApp replyToApplicationShouldTerminate:YES];});CFRunLoopWakeUp(CFRunLoopGetMain());});"}]},{"path":"protected-mac-manager/native/manager_tests.cpp","oldSha256":"c98a2a8380481807f96cd93a747c1f548c46950354d29f4af7ba97e500f93ded","sha256":"99d5efba319f4da45e7acd7376fef7ec0aafd11304645121c463a18db5d29226","before":"std::runtime_error(\"test_device_unavailable\")","after":"std::runtime_error(\"test_device_unavailable:\"+device.error)"},{"path":"protected-mac-manager/native/generate_manager_vectors.mjs","oldSha256":"c7235deb3a9725fa7bff26875f1b6f4741aa149dd0b2995dd262080f26d93336","sha256":"830db881806256b53d5079c8d89d907b64a80afbe1429ab81b4ac851a232be26","before":"throw new Error('Native test identity unavailable')","after":"throw new Error('Native test identity unavailable: '+(probe.stderr||probe.error?.message||'unknown').trim())"},{"path":"protected-mac-manager/source-manifest.json","oldSha256":"d39aad85d4bbc7c296026732a8549f0fb0021e415943591ae7ecfe020e56d47f","sha256":"36ad27c70ccc7a9a727e887b79cee80d5f742f5522fabb987ae0e4a5ce3095f2","before":null,"after":null}]
          GILL_ROOT_PATCHES_EOF
          node "$RUNNER_TEMP/sealed-native/root-rebind.mjs" before "$RUNNER_TEMP/sealed-native/input" 6716d56e6f615385b7d3cdafef0235fd52c252915200056ed1297997678e2309 b32c36e9e9f3a05a4c9c1811855c96f915dc9cb03f8bef70b7c1cd1322827e68 2a4a1a1f912ed682fdc1168958ba003450bcfafb45efb3dbd5a0ccf2f27229a4 aae6b982b79e3332987b1b3219a0e7049ee0d2634859d338f316ba892fc317d9 "$RUNNER_TEMP/sealed-native/reviewed-patches.json" e3e00116c566a275750a91505c1298be30c3d2bf871979918bce249de8b4dbcb
          cat > "$RUNNER_TEMP/sealed-native/input/encrypted-ci/driver.mjs" <<'GILL_ROOT_DRIVER_EOF'
          // Runs only inside authenticated, sealed encrypted input; stdout is private workflow file.
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {spawnSync} from 'node:child_process';import {fileURLToPath} from 'node:url';import {hash,sha,walk} from './transport.mjs';import {verifyResult,writeCheckpoint} from './result.mjs';
          const root=path.dirname(path.dirname(fileURLToPath(import.meta.url))),arch=process.argv[2],output=path.resolve(process.argv[3]);
          assert.equal(process.platform,'darwin');assert.equal(process.env.CI,'true');assert.equal(process.arch,arch==='arm64'?'arm64':'x64');assert(['arm64','x86_64'].includes(arch));assert(Number(process.versions.node.split('.')[0])>=24);
          const manifest=JSON.parse(fs.readFileSync(path.join(root,'input-manifest.json')));assert.equal(sha(Buffer.from(JSON.stringify(manifest.sourceRecords))),manifest.sourceSeal);for(const r of manifest.sourceRecords)assert.equal(await hash(path.join(root,r.path)),r.sha256,'input changed');assert.equal(await hash(path.join(root,'encrypted-ci/driver.mjs')),manifest.driverSeal);
          fs.mkdirSync(output,{recursive:true,mode:0o700});const work=path.join(output,'work');fs.mkdirSync(work);const evidence=path.join(output,'evidence');fs.mkdirSync(evidence);const env={...process.env,CI:'true',CMAKE_BUILD_PARALLEL_LEVEL:'1',CTEST_PARALLEL_LEVEL:'1',GILL_NATIVE_RUNTIME_DIR:path.join(root,'protected-mac-plugins/runtime')};for(const k of Object.keys(env))if(/TOKEN|SECRET|GILL_MAC14_CI_KEY|GILL_KEY|ACTIONS_RUNTIME/i.test(k))delete env[k];
          const meta={sourceSeal:manifest.sourceSeal,pluginCandidateSeal:manifest.pluginCandidateSeal,managerSourceSeal:manifest.managerSourceSeal,managerRunnerSeal:await hash(path.join(root,'protected-mac-manager/native-run.mjs')),managerProfileSeal:await hash(path.join(root,'protected-mac-manager/public-profile/descriptor.json')),driverSeal:manifest.driverSeal,arch,completed:[],stageExit:{},nativeAcceptance:'incomplete'};
          const resume=path.join(root,'resume');if(fs.existsSync(resume)){const prior=await verifyResult(resume,manifest.sourceSeal);assert.equal(prior.arch,arch,'resume must match target architecture');for(const stage of prior.completed){fs.cpSync(path.join(resume,stage),path.join(evidence,stage),{recursive:true});meta.completed.push(stage);meta.stageExit[stage]=0;}}
          function retain(stage,build){if(!fs.existsSync(build))return;for(const r of walk(build)){// Keep receipts, bounded private diagnostics and actual bundles; never object intermediates.
           if(!(/\.app\//.test(r.path)||/\.vst3\//.test(r.path)||/\.(json|log)$/.test(r.path)||r.path==='identity/gill_factory_identity'))continue;
           if(fs.statSync(r.file).size>256*1024*1024)throw Error('Evidence file bound');const dest=path.join(evidence,stage,r.path);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.copyFileSync(r.file,dest);fs.chmodSync(dest,fs.statSync(r.file).mode&0o111?0o700:0o600);
