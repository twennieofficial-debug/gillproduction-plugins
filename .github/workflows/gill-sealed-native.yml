        shell: bash
        run: |
          set +x
          cat > "$RUNNER_TEMP/sealed-native/monitor.mjs" <<'GILL_PROGRESS_CONTROL_EOF'
          // Generic outer monitor. Compiler and customer logs never go to public stdout.
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {spawn} from 'node:child_process';
          import {fileURLToPath} from 'node:url';
          const LIMIT=2*1024*1024;
          function boundedJson(file){
            try{const s=fs.lstatSync(file);if(!s.isFile()||s.isSymbolicLink()||s.size>LIMIT)return null;return JSON.parse(fs.readFileSync(file,'utf8'));}catch{return null;}
          }
          export function counters(base){
            const active=path.resolve(base,'output/work/plugins'),retained=path.resolve(base,'output/evidence/plugins');
            const folder=fs.existsSync(path.join(active,'commands.json'))?active:retained,commands=boundedJson(path.join(folder,'commands.json'));
            const checkpoint=boundedJson(path.resolve(base,'output/evidence/checkpoint.json'));
            const result={kind:'native-progress',managerComplete:checkpoint?.completed?.includes('manager')===true,operationsComplete:0,familiesComplete:0};
            if(!Array.isArray(commands)||commands.length>10000)return result;
            result.operationsComplete=commands.filter(c=>c?.status===0&&!c.signal&&!c.error).length;
            let entries=[];try{entries=fs.readdirSync(folder,{withFileTypes:true});}catch{return result;}
            const families=new Set();
            for(const e of entries){
              const m=e.name.match(/^(\d{3,5})-synthetic-authorized-([A-Za-z0-9_]+)\.log$/);
              if(!m||!e.isFile()||e.isSymbolicLink())continue;
              const c=commands[Number(m[1])];
              if(c?.status===0&&!c.signal&&!c.error)families.add(m[2]);
            }
            result.familiesComplete=families.size;return result;
          }
          export async function monitor(base,arch,{driver,intervalMs=60000,emit=s=>process.stdout.write(JSON.stringify(s)+'\n')}={}){
            assert(['arm64','x86_64'].includes(arch));assert(Number.isSafeInteger(intervalMs)&&intervalMs>=10);
            base=fs.realpathSync(base);
            const entry=driver??path.join(base,'input/encrypted-ci/driver.mjs');
            const logFile=path.join(base,'private.log');
            const fd=fs.openSync(logFile,'wx',0o600);
            let previous='';
            const report=()=>{const c=counters(base),s=JSON.stringify(c);if(s!==previous){previous=s;emit(c);}};
            report();const timer=setInterval(report,intervalMs);
            let child,code=1,signal=null;
            const forward=()=>{if(child&&!child.killed)child.kill('SIGTERM');};
            process.on('SIGTERM',forward);process.on('SIGINT',forward);
            try{
              const finish=await new Promise(resolve=>{
                child=spawn(process.execPath,[entry,arch,path.join(base,'output')],{stdio:['ignore',fd,fd],env:process.env});
                child.once('error',()=>resolve({code:1,signal:null}));
                child.once('close',(code,signal)=>resolve({code:code??1,signal}));
              });code=finish.code;signal=finish.signal;
            }finally{
              clearInterval(timer);process.off('SIGTERM',forward);process.off('SIGINT',forward);
              fs.closeSync(fd);report();emit({kind:'native-driver-finished',exit:code,terminated:signal!==null});
            }
            return code;
          }
          if(process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url)){
            try{process.exitCode=await monitor(process.argv[2],process.argv[3]);}
            catch{console.error('Native monitor failed; private diagnostics were not published');process.exitCode=1;}
          }
          GILL_PROGRESS_CONTROL_EOF
          node "$RUNNER_TEMP/sealed-native/monitor.mjs" "$RUNNER_TEMP/sealed-native" "$TARGET_ARCH"
      - name: Restore exact disposable synthetic Keychain state
        if: always()
        env:
          CI: 'true'
          GILL_SYNTHETIC_KEYCHAIN_ISOLATION: 'explicit-isolated-ci-only'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/sealed-native/input/synthetic-isolation/recover-all.mjs" ]; then
            node "$RUNNER_TEMP/sealed-native/input/synthetic-isolation/recover-all.mjs" "$RUNNER_TEMP/sealed-native/output/evidence" > "$RUNNER_TEMP/sealed-native/synthetic-recovery.log" 2>&1
          fi
      - name: Encrypt evidence including failures
        if: always()
        env:
          GILL_KEY: ${{ secrets.GILL_MAC14_CI_KEY }}
        shell: bash
        run: node "$RUNNER_TEMP/sealed-native/bootstrap.mjs" seal "$RUNNER_TEMP/sealed-native"
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-result-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed-native/result.gillenc
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
