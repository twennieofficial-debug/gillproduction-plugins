      - name: Bind authenticated synthetic harness correction
        env:
          GILL_KEY: ${{ secrets.GILL_MAC14_CI_KEY }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sealed-native/overlay.mjs" <<'GILL_SYNTHETIC_OVERLAY_EOF'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {decrypt,extract,hash,sha,walk} from './transport.mjs';
          const root=process.argv[2],key=Buffer.from(process.env.GILL_KEY||'','base64');delete process.env.GILL_KEY;
          try{await decrypt(path.join(root,'overlay.gillenc'),path.join(root,'overlay.archive'),key,'f3e5b01aadd90dfaa5949bb5760061a4f9944c603e842a745c505892778a70b1');await extract(path.join(root,'overlay.archive'),path.join(root,'overlay'));const b=JSON.parse(fs.readFileSync(path.join(root,'overlay/binding.json')));assert.equal(b.schema,2);assert.equal(b.baseSourceSeal,'b72929135dee460b70bf6cb0c576ee6355dd6002173f83de3244c30288a066d3');assert.equal(b.effectiveSourceSeal,'89528ab8f6c17f56bda6685c33493b128fe8723e0c6d06ff17ad2fc9d34bb1ad');assert.equal(b.shippingSourceChanged,false);assert.deepEqual(b.changes,[{"path":"integration/macos-key-attributes-compat.h","oldSha256":null,"sha256":"3955a1fefeb162891c9fe28975f818e832d2b3f3120decf0631923feafc1b4dc"},{"path":"protected-mac-plugins/run-native.mjs","oldSha256":"ea73edb2a3d73e41717cdba0a1b0b84a8be6c994304b400252dd4700e6c1cb5f","sha256":"5ff69477b887a992b7b7738c592afd19aad02e0063fe15bd451a9b7ec231410e"},{"path":"protected-mac-plugins/candidate-files.json","oldSha256":"1919feea98374af6dc4f154581696c487a113f3f2069b7d35b660c9239efd938","sha256":"e52d2447a1bdca5e3cee319b6f6695f1a813da6aee1a7bc3b910bd0acdc2c8b9"},{"path":"protected-mac-plugins/tests/SyntheticAcceptance.h","oldSha256":"7da044ab78eae05668244e196b7faf7108e046392819fa35c7872a82166952c9","sha256":"b0b918327415f535d080cd27f978db8a49f629c3ef9b171600e290a74368bfb9"},{"path":"synthetic-isolation/isolate.mjs","oldSha256":null,"sha256":"389c68ad0bd2427aa548bd6e583ba5ddb693cac17b7197b962e3454a8240e05e"},{"path":"synthetic-isolation/recover-all.mjs","oldSha256":null,"sha256":"755e9bc12dce6c63d33ffb5e1f96a72c68fdf7d5983b8a123fdb4a16f9922eab"},{"path":"protected-mac-plugins/source/Effects16/advanced-ui/AdvancedScalpel.h","oldSha256":null,"sha256":"753b0022a7abf386652c7f3ba4557f4d52f3258683fce540267b78319672cf5c"}]);assert.deepEqual(walk(path.join(root,'overlay')).map(r=>r.path).sort(),['binding.json',...b.changes.map(c=>c.path)].sort());const p=path.join(root,'input/input-manifest.json'),m=JSON.parse(fs.readFileSync(p));assert.equal(m.sourceSeal,b.baseSourceSeal);assert.equal(sha(Buffer.from(JSON.stringify(m.sourceRecords))),b.baseSourceSeal);for(const c of b.changes){assert.equal(await hash(path.join(root,'overlay',c.path)),c.sha256);const old=m.sourceRecords.find(r=>r.path===c.path),dest=path.join(root,'input',c.path);if(c.oldSha256){assert(old);assert.equal(old.sha256,c.oldSha256);assert.equal(await hash(dest),c.oldSha256);}else{assert(!old);assert(!fs.existsSync(dest));}}for(const c of b.changes){const dest=path.join(root,'input',c.path);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.copyFileSync(path.join(root,'overlay',c.path),dest);const old=m.sourceRecords.find(r=>r.path===c.path);if(old)old.sha256=c.sha256;else m.sourceRecords.push({path:c.path,sha256:c.sha256});}assert.equal(m.pluginCandidateSeal,b.changes.find(c=>c.path==='protected-mac-plugins/candidate-files.json').oldSha256);assert.equal(b.pluginCandidateSeal,b.changes.find(c=>c.path==='protected-mac-plugins/candidate-files.json').sha256);m.pluginCandidateSeal=b.pluginCandidateSeal;m.sourceSeal=sha(Buffer.from(JSON.stringify(m.sourceRecords)));assert.equal(m.sourceSeal,b.effectiveSourceSeal);fs.writeFileSync(p,JSON.stringify(m,null,2));}finally{key.fill(0);fs.rmSync(path.join(root,'overlay.archive'),{force:true});}
