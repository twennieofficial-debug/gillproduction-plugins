      - name: Download pinned encrypted input
        env:
          GH_TOKEN: ${{ github.token }}
          GILL_INPUT_URL: ${{ secrets.GILL_MAC14_INPUT_URL }}
        shell: bash
        run: node "$RUNNER_TEMP/sealed-native/bootstrap.mjs" download "$RUNNER_TEMP/sealed-native" 9bb021c9813609257fa68e0e0ca16c84d58c35deb081081efa3ea2dfd29b4534 641754142
      - name: Authenticate and open input
