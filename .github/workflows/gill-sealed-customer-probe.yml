          GILL_KEY: ${{ secrets.GILL_MAC14_CI_KEY }}
        shell: bash
        run: |
          set -eu
          set +x
          umask 077
          nohup node "$RUNNER_TEMP/customer-probe/input/customer-probe-ci/driver.mjs" --consent-disposable-production-pairing "$RUNNER_TEMP/customer-probe" > "$RUNNER_TEMP/customer-probe/driver-private.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/customer-probe/driver.pid"
          node "$RUNNER_TEMP/customer-probe/control.mjs" challenge "$RUNNER_TEMP/customer-probe"
      - name: Upload encrypted challenge for root browser approval
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-customer-challenge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/customer-probe/challenge.gillenc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Await real customer approval and production cache verification
        shell: bash
        run: node "$RUNNER_TEMP/customer-probe/control.mjs" wait "$RUNNER_TEMP/customer-probe"
      - name: Restore original Keychain state
        if: always()
        shell: bash
        run: node "$RUNNER_TEMP/customer-probe/control.mjs" recover "$RUNNER_TEMP/customer-probe"
      - name: Encrypt proof and diagnostics
        if: always()
        env:
          GILL_KEY: ${{ secrets.GILL_MAC14_CI_KEY }}
        shell: bash
        run: node "$RUNNER_TEMP/customer-probe/finish.mjs" "$RUNNER_TEMP/customer-probe"
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-customer-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/customer-probe/result.gillenc
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
