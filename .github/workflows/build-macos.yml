name: GILL Mac Universal Installer

# Local workflow template. Copy to .github/workflows/build-macos.yml in the
# explicitly authorized repository. No automatic push or scheduled runs.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gill-macos-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  PIPELINE: work/packaging/macos/pipeline.py
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 600M

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify packaging release gates
        run: python3 -B -m unittest discover -s work/packaging/macos -p 'test_*.py'

  native-build:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build tools
        run: |
          brew install ninja ccache
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          cmake --version
          python3 "$PIPELINE" check-source --source work
      - name: Fresh native build, DSP, UI and cross-plugin LIVE/PRO tests
        run: >-
          python3 "$PIPELINE" build --source work
          --build-root "$RUNNER_TEMP/gill-build" --destination "$RUNNER_TEMP/native" --jobs 2
      - name: Update22 portable audio state sidechain regressions
        run: >-
          python3 -B work/Mac22/regression/run.py --source work
          --native "$RUNNER_TEMP/native" --destination "$RUNNER_TEMP/native/test-evidence/UPDATE22"
          --build-root "$RUNNER_TEMP/gill-build" --jobs 2
      - name: Reverify Update22 regression evidence
        run: python3 -B work/Mac22/regression/run.py --verify "$RUNNER_TEMP/native"
      - name: Archive native results with executable permissions
        run: tar -C "$RUNNER_TEMP/native" -czf "$RUNNER_TEMP/native-${{ matrix.architecture }}.tar.gz" .
      - name: Retain compact UI and native test reports separately
        uses: actions/upload-artifact@v4
        with:
          name: ui-and-tests-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/native/test-evidence
            ${{ runner.temp }}/native/native-build.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.architecture }}
          path: ${{ runner.temp }}/native-${{ matrix.architecture }}.tar.gz
          retention-days: 14
          compression-level: 0
      - name: Retain failing build evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-native-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/native/logs
            ${{ runner.temp }}/native/test-evidence
            ${{ runner.temp }}/native/native-failure.json
          retention-days: 14
      - name: Preserve native binaries for a separate diagnostic run
        if: failure()
        continue-on-error: true
        env:
          DIAGNOSTIC_ARCH: ${{ matrix.architecture }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          plugins = root / 'native/plugins'
          if not plugins.is_dir() or not any(plugins.glob('*.vst3')):
              print('No native VST3 bundles available to preserve.')
              raise SystemExit(0)
          candidates = ['native/plugins', 'native/native-failure.json',
                        'native/test-evidence/QUALITY_HOST',
                        'gill-build/QualityHost/GillQualityHost']
          entries = [name for name in candidates if (root / name).exists()]
          payload_bytes = sum(p.stat().st_size for name in entries
                              for p in ([root / name] if (root / name).is_file()
                                        else (root / name).rglob('*'))
                              if p.is_file())
          if payload_bytes > 2 * 1024**3:
              raise SystemExit('Diagnostic payload exceeds the 2 GiB uncompressed limit.')
          metadata = {'diagnostic_only': True, 'release_approved': False,
                      'architecture': os.environ['DIAGNOSTIC_ARCH'],
                      'source_commit': os.environ['GITHUB_SHA'],
                      'run_id': os.environ['GITHUB_RUN_ID'],
                      'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'payload_bytes': payload_bytes,
                      'plugins': sorted(p.name for p in plugins.glob('*.vst3'))}
          (root / 'diagnostic-binaries.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          entries.append('diagnostic-binaries.json')
          archive = root / ('failed-native-binaries-' + os.environ['DIAGNOSTIC_ARCH'] + '.tar.gz')
          subprocess.run(['tar', '-C', str(root), '-czf', str(archive), *entries], check=True, timeout=240)
          print(f'Preserved {len(metadata["plugins"])} native bundles; {archive.stat().st_size} archive bytes.')
          PY
      - name: Retain failed native binaries with executable permissions
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: failed-native-binaries-${{ matrix.architecture }}
          path: ${{ runner.temp }}/failed-native-binaries-${{ matrix.architecture }}.tar.gz
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0

  merge:
    needs: native-build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ${{ runner.temp }}/downloads
          merge-multiple: true
      - name: Restore native bundles
        run: |
          mkdir -p "$RUNNER_TEMP/arm64" "$RUNNER_TEMP/x86_64"
          tar -xzf "$RUNNER_TEMP/downloads/native-arm64.tar.gz" -C "$RUNNER_TEMP/arm64"
          tar -xzf "$RUNNER_TEMP/downloads/native-x86_64.tar.gz" -C "$RUNNER_TEMP/x86_64"

      - name: Assemble and sign Universal bundles
        run: >-
          python3 "$PIPELINE" merge --arm64 "$RUNNER_TEMP/arm64"
          --x86_64 "$RUNNER_TEMP/x86_64" --destination "$RUNNER_TEMP/universal"
      - run: tar -C "$RUNNER_TEMP/universal" -czf "$RUNNER_TEMP/universal.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: universal
          path: ${{ runner.temp }}/universal.tar.gz
          retention-days: 14
          compression-level: 0

  universal-validation:
    needs: merge
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: universal
          path: ${{ runner.temp }}/downloads
      - name: Restore Universal build and pinned official validator
        run: |
          mkdir -p "$RUNNER_TEMP/universal" "$RUNNER_TEMP/pluginval"
          tar -xzf "$RUNNER_TEMP/downloads/universal.tar.gz" -C "$RUNNER_TEMP/universal"
          curl --fail --location --retry 3 https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip --output "$RUNNER_TEMP/pluginval.zip"
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  $RUNNER_TEMP/pluginval.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/pluginval.zip" "$RUNNER_TEMP/pluginval"
      - name: Validate exact Universal bundles natively
        run: >-
          python3 "$PIPELINE" validate --universal "$RUNNER_TEMP/universal"
          --pluginval "$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval"
          --destination "$RUNNER_TEMP/validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.architecture }}
          path: ${{ runner.temp }}/validation
          retention-days: 14

  installer:
    needs: universal-validation
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: universal
          path: ${{ runner.temp }}/downloads
      - uses: actions/download-artifact@v4
        with:
          name: validation-arm64
          path: ${{ runner.temp }}/validation/arm64
      - uses: actions/download-artifact@v4
        with:
          name: validation-x86_64
          path: ${{ runner.temp }}/validation/x86_64
      - name: Restore Universal bundles and corresponding full source
        run: |
          mkdir -p "$RUNNER_TEMP/universal"
          tar -xzf "$RUNNER_TEMP/downloads/universal.tar.gz" -C "$RUNNER_TEMP/universal"
          python3 "$PIPELINE" source-archive --source work --destination "$RUNNER_TEMP/GILL-QUELLCODE-22.zip"

      - name: Produce and actually install all 75 DMG packages
        run: >-
          python3 "$PIPELINE" package --universal "$RUNNER_TEMP/universal"
          --validations "$RUNNER_TEMP/validation" --source work
          --source-archive "$RUNNER_TEMP/GILL-QUELLCODE-22.zip"
          --staging "$RUNNER_TEMP/package-staging" --destination "$RUNNER_TEMP/delivery" --test-install
      - name: Retain exact corresponding source ZIP
        if: success()
        run: cp "$RUNNER_TEMP/GILL-QUELLCODE-22.zip" "$RUNNER_TEMP/delivery/GILL-QUELLCODE-22.zip"
      - name: Publish only verified Mac22 downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B work/packaging/macos/publish22.py --delivery "$RUNNER_TEMP/delivery" --source work --source-archive "$RUNNER_TEMP/GILL-QUELLCODE-22.zip" --universal "$RUNNER_TEMP/universal" --validations "$RUNNER_TEMP/validation"
      - name: Retain installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-mac-installer
          path: |
            ${{ runner.temp }}/delivery/verification
            ${{ runner.temp }}/delivery/*.txt
            ${{ runner.temp }}/delivery/*.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GILL-MAC-INSTALLER-UNSIGNIERT-TESTVERSION
          path: ${{ runner.temp }}/delivery
          retention-days: 14
          compression-level: 0
