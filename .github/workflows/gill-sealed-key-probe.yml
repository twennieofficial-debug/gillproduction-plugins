name: Sealed separate-caller diagnostic
on:
  push:
    branches: ['prepare/gill-protected-mac22-20261014']
    paths: ['.github/workflows/gill-sealed-key-probe.yml']
permissions:
  contents: read
concurrency:
  group: sealed-native-acceptance
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'twennieofficial-debug/gillproduction-plugins' && github.event_name == 'push' && github.ref == 'refs/heads/prepare/gill-protected-mac22-20261014'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install generic encrypted transport
        shell: bash
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/key-probe/output"
          cat > "$RUNNER_TEMP/key-probe/transport.mjs" <<'GILL_GENERIC_0'
          // Generic bounded transport. No project source, credentials, shell evaluation or dependencies.
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {pipeline} from 'node:stream/promises';
          import {Transform} from 'node:stream';
          import assert from 'node:assert/strict';
          export const LIMITS={files:200000,index:32*1024*1024,file:2*1024**3,total:16*1024**3};
          const MAGIC=Buffer.from('GILLENC1');
          function writeAll(fd,bytes){let offset=0;while(offset<bytes.length){const n=fs.writeSync(fd,bytes,offset,bytes.length-offset);assert(n>0);offset+=n;}}
          export const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          export async function hash(file){const h=crypto.createHash('sha256');for await(const b of fs.createReadStream(file))h.update(b);return h.digest('hex');}
          export function safeName(name){assert.equal(typeof name,'string');assert(name.length>0&&name.length<=1024);assert(!/[\\\x00-\x1f:]/.test(name));assert(!name.startsWith('/'));for(const p of name.split('/'))assert(p&&p!=='.'&&p!=='..'&&!/[. ]$/.test(p)&&! /^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(p));return name;}
          export function validateIndex(index,limits=LIMITS){assert(Array.isArray(index)&&index.length<=limits.files);let total=0;const seen=new Set();for(const r of index){safeName(r.path);assert(!seen.has(r.path.toLowerCase()),'duplicate/case alias');seen.add(r.path.toLowerCase());assert(Number.isSafeInteger(r.size)&&r.size>=0&&r.size<=limits.file,'file bound');assert(/^[a-f0-9]{64}$/.test(r.sha256));assert([0o600,0o700].includes(r.mode));total+=r.size;assert(total<=limits.total,'archive bound');}for(const r of index){const p=r.path.split('/');while(p.length>1){p.pop();assert(!seen.has(p.join('/').toLowerCase()),'file/directory collision');}}return total;}
          export function walk(root,prefix=''){const out=[];for(const e of fs.readdirSync(root,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name))){const full=path.join(root,e.name),name=prefix+e.name;assert(!e.isSymbolicLink(),'symlink forbidden');if(e.isDirectory())out.push(...walk(full,name+'/'));else{assert(e.isFile(),'special file forbidden');out.push({path:safeName(name),file:full});}}return out;}
          export async function pack(records,destination){assert(!fs.existsSync(destination));assert(records.length<=LIMITS.files);const index=[];for(const r of records){const s=fs.lstatSync(r.file);assert(s.isFile()&&!s.isSymbolicLink());index.push({path:safeName(r.path),size:s.size,sha256:await hash(r.file),mode:s.mode&0o111?0o700:0o600});}validateIndex(index);const bytes=Buffer.from(JSON.stringify(index));assert(bytes.length<=LIMITS.index);const fd=fs.openSync(destination,'wx',0o600);try{const header=Buffer.alloc(8);header.writeBigUInt64BE(BigInt(bytes.length));writeAll(fd,header);writeAll(fd,bytes);for(let i=0;i<records.length;i++){let n=0;const h=crypto.createHash('sha256');for await(const b of fs.createReadStream(records[i].file)){n+=b.length;assert(n<=index[i].size);h.update(b);writeAll(fd,b);}assert.equal(n,index[i].size);assert.equal(h.digest('hex'),index[i].sha256,'input changed while packing');}}catch(e){fs.closeSync(fd);fs.rmSync(destination,{force:true});throw e;}fs.closeSync(fd);return index;}
          function bounded(max){let size=0;return new Transform({transform(b,e,cb){size+=b.length;cb(size>max?Error('stream size bound'):null,b);}});}
          function keyCheck(key){assert(Buffer.isBuffer(key)&&key.length===32,'AES256 key required');}
          export async function encrypt(input,output,key){keyCheck(key);assert(fs.statSync(input).size<=LIMITS.total+LIMITS.index+8);assert(!fs.existsSync(output));const nonce=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,nonce);cipher.setAAD(MAGIC);fs.writeFileSync(output,Buffer.concat([MAGIC,nonce]),{flag:'wx',mode:0o600});try{await pipeline(fs.createReadStream(input),cipher,fs.createWriteStream(output,{flags:'a'}));fs.appendFileSync(output,cipher.getAuthTag());}catch(e){fs.rmSync(output,{force:true});throw e;}return hash(output);}
          export async function decrypt(input,output,key,expected){keyCheck(key);assert(/^[a-f0-9]{64}$/.test(expected));const n=fs.statSync(input).size;assert(n>=36&&n<=LIMITS.total+LIMITS.index+44,'ciphertext size');assert.equal(await hash(input),expected,'ciphertext pin');assert(!fs.existsSync(output));const fd=fs.openSync(input,'r'),head=Buffer.alloc(20),tag=Buffer.alloc(16);fs.readSync(fd,head,0,20,0);fs.readSync(fd,tag,0,16,n-16);fs.closeSync(fd);assert(head.subarray(0,8).equals(MAGIC));const cipher=crypto.createDecipheriv('aes-256-gcm',key,head.subarray(8));cipher.setAAD(MAGIC);cipher.setAuthTag(tag);try{await pipeline(fs.createReadStream(input,{start:20,end:n-17}),cipher,bounded(LIMITS.total+LIMITS.index+8),fs.createWriteStream(output,{flags:'wx',mode:0o600}));}catch(e){fs.rmSync(output,{force:true});throw e;}}
          export async function extract(input,destination){assert(!fs.existsSync(destination),'fresh extraction directory required');const size=fs.statSync(input).size;assert(size>=8&&size<=LIMITS.total+LIMITS.index+8);const fd=fs.openSync(input,'r');let index,start;try{const h=Buffer.alloc(8);assert.equal(fs.readSync(fd,h,0,8,0),8);const n=Number(h.readBigUInt64BE());assert(Number.isSafeInteger(n)&&n<=LIMITS.index&&n<=size-8);const b=Buffer.alloc(n);assert.equal(fs.readSync(fd,b,0,n,8),n);index=JSON.parse(b);assert.equal(8+n+validateIndex(index),size,'truncation/trailing bytes');start=8+n;}finally{fs.closeSync(fd);}fs.mkdirSync(destination,{mode:0o700});try{for(const r of index){const target=path.join(destination,r.path);fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700});if(r.size)await pipeline(fs.createReadStream(input,{start,end:start+r.size-1}),fs.createWriteStream(target,{flags:'wx',mode:r.mode}));else fs.writeFileSync(target,'',{flag:'wx',mode:r.mode});assert.equal(await hash(target),r.sha256,'content digest');start+=r.size;}return index;}catch(e){fs.rmSync(destination,{recursive:true,force:true});throw e;}}
          GILL_GENERIC_0
          cat > "$RUNNER_TEMP/key-probe/bootstrap.mjs" <<'GILL_GENERIC_1'
          // Generic public bootstrap; bounded errors only. Never prints filenames, input content or keys.
          import fs from 'node:fs';import path from 'node:path';import {Readable,Transform} from 'node:stream';import {pipeline} from 'node:stream/promises';import assert from 'node:assert/strict';import {decrypt,extract,pack,encrypt,walk,hash,LIMITS} from './transport.mjs';
          let failure='sealed_operation_failed';
          try{const [operation,base,expected,asset]=process.argv.slice(2);assert(base);const root=path.resolve(base);fs.mkdirSync(root,{recursive:true,mode:0o700});
           if(operation==='download'){
            assert(/^[1-9][0-9]*$/.test(asset));let url=process.env.GILL_INPUT_URL||'https://api.github.com/repos/twennieofficial-debug/gillproduction-plugins/releases/assets/'+asset;let response;
            if(process.env.GILL_INPUT_URL){const signed=new URL(url);assert(signed.protocol==='https:'&&!signed.username&&!signed.password&&['release-assets.githubusercontent.com','objects.githubusercontent.com'].includes(signed.hostname));}
            for(let redirects=0;redirects<4;redirects++){const headers={'Accept':'application/octet-stream','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sealed-native-ci'};if(new URL(url).hostname==='api.github.com')headers.Authorization='Bearer '+process.env.GH_TOKEN;response=await fetch(url,{headers,redirect:'manual',signal:AbortSignal.timeout(120000)});if(![301,302,303,307,308].includes(response.status))break;url=new URL(response.headers.get('location'),url).href;const u=new URL(url);if(!['release-assets.githubusercontent.com','objects.githubusercontent.com','github.com'].includes(u.hostname))failure='unexpected_redirect_host';assert(u.protocol==='https:'&&!u.username&&!u.password&&['release-assets.githubusercontent.com','objects.githubusercontent.com','github.com'].includes(u.hostname));}
            if(!response.ok)failure='download_http_'+response.status;assert(response.ok&&response.body);const length=Number(response.headers.get('content-length'));if(length)assert(length<=LIMITS.total+LIMITS.index+44);let bytes=0;await pipeline(Readable.fromWeb(response.body),new Transform({transform(b,e,cb){bytes+=b.length;cb(bytes>LIMITS.total+LIMITS.index+44?Error('bound'):null,b);}}),fs.createWriteStream(path.join(root,'input.gillenc'),{flags:'wx',mode:0o600}));
           }else if(operation==='open'){
            const key=Buffer.from(process.env.GILL_KEY||'','base64'),archive=path.join(root,'input.archive');try{await decrypt(path.join(root,'input.gillenc'),archive,key,expected);await extract(archive,path.join(root,'input'));}finally{key.fill(0);fs.rmSync(archive,{force:true});fs.rmSync(path.join(root,'input.gillenc'),{force:true});}
           }else if(operation==='seal'){
            const key=Buffer.from(process.env.GILL_KEY||'','base64'),archive=path.join(root,'result.archive'),evidence=path.join(root,'output/evidence');fs.mkdirSync(evidence,{recursive:true});if(fs.existsSync(path.join(root,'private.log')))fs.copyFileSync(path.join(root,'private.log'),path.join(evidence,'workflow-private.log'));
            // Refresh only the file inventory: never promote an interrupted stage to accepted.
            const checkpoint=path.join(evidence,'checkpoint.json');if(fs.existsSync(checkpoint)){const m=JSON.parse(fs.readFileSync(checkpoint));m.files=[];for(const r of walk(evidence).filter(r=>r.path!=='checkpoint.json'))m.files.push({path:r.path,sha256:await hash(r.file)});fs.writeFileSync(checkpoint,JSON.stringify(m,null,2));}
            try{await pack(walk(evidence),archive);await encrypt(archive,path.join(root,'result.gillenc'),key);}finally{key.fill(0);fs.rmSync(archive,{force:true});}
           }else throw Error('operation');
          }catch{console.error('Sealed CI operation failed: '+failure+'. No secrets or signed URLs logged.');process.exitCode=1;}
          GILL_GENERIC_1
          cat > "$RUNNER_TEMP/key-probe/extras-open.mjs" <<'GILL_GENERIC_2'
          // Generic public decrypt/install helper. No source bytes, URLs or keys are logged.
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';
          import {decrypt,extract,walk,hash,sha} from './transport.mjs';
          try{const [base,pin,contractPin]=process.argv.slice(2);const key=Buffer.from(process.env.GILL_KEY||'','base64');
           try{await decrypt(path.join(base,'extras.gillenc'),path.join(base,'extras.archive'),key,pin);await extract(path.join(base,'extras.archive'),path.join(base,'extras'));}finally{key.fill(0);fs.rmSync(path.join(base,'extras.archive'),{force:true});}
           const extra=path.join(base,'extras'),dest=path.join(base,'input');
           assert.equal(await hash(path.join(extra,'key-probe-ci/contract.json')),contractPin);
           const c=JSON.parse(fs.readFileSync(path.join(extra,'key-probe-ci/contract.json')));
           const expected=[...c.extras.map(r=>r.path),'key-probe-ci/contract.json'].sort();assert.deepEqual(walk(extra).map(r=>r.path).sort(),expected);
           for(const r of c.extras){assert(r.path.startsWith('key-sharing-probe/')||['key-probe-ci/driver.mjs','key-probe-ci/model.mjs','integration/macos-key-attributes-compat.h'].includes(r.path));assert.equal(await hash(path.join(extra,r.path)),r.sha256);}
           for(const r of walk(extra)){const target=path.join(dest,r.path);assert(!fs.existsSync(target),'refuse overwrite');fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700});fs.copyFileSync(r.file,target,fs.constants.COPYFILE_EXCL);}
          }catch{console.error('Authenticated probe extras failed; no source or secret logged');process.exitCode=1;}
          GILL_GENERIC_2
          cat > "$RUNNER_TEMP/key-probe/finish.mjs" <<'GILL_GENERIC_3'
          import fs from 'node:fs';import path from 'node:path';import {pack,encrypt,walk,hash} from './transport.mjs';
          try{const base=process.argv[2],evidence=path.join(base,'output/evidence');fs.mkdirSync(evidence,{recursive:true,mode:0o700});
           const log=path.join(base,'driver-private.log');if(fs.existsSync(log))fs.copyFileSync(log,path.join(evidence,'workflow-private.log'));
           const receipt=path.join(evidence,'probe-checkpoint.json');if(fs.existsSync(receipt)){const m=JSON.parse(fs.readFileSync(receipt));m.files=[];for(const r of walk(evidence).filter(r=>r.path!=='probe-checkpoint.json'))m.files.push({path:r.path,sha256:await hash(r.file)});fs.writeFileSync(receipt,JSON.stringify(m,null,2));}
           const archive=path.join(base,'result.archive'),key=Buffer.from(process.env.GILL_KEY||'','base64');
           try{await pack(walk(evidence),archive);await encrypt(archive,path.join(base,'result.gillenc'),key);}finally{key.fill(0);fs.rmSync(archive,{force:true});}
          }catch{console.error('Probe evidence encryption failed');process.exitCode=1;}
          GILL_GENERIC_3
          cat > "$RUNNER_TEMP/key-probe/extras.b64" <<'GILL_ENCRYPTED_EXTRAS'
          
          GILL_ENCRYPTED_EXTRAS
          node -e 'const fs=require("fs"),p=process.argv[1];fs.writeFileSync(p+"/extras.gillenc",Buffer.from(fs.readFileSync(p+"/extras.b64","utf8").trim(),"base64"),{mode:384});' "$RUNNER_TEMP/key-probe"
      - name: Download existing encrypted original
        env:
          GH_TOKEN: ${{ github.token }}
          GILL_INPUT_URL: ${{ secrets.GILL_MAC14_INPUT_URL }}
        shell: bash
        run: node "$RUNNER_TEMP/key-probe/bootstrap.mjs" download "$RUNNER_TEMP/key-probe" 67025a9f7569bc8dbc0a3b9f77a75a54480b33eb5615ae4139c4f7ac34b927b7 640295598
      - name: Authenticate original and exact probe extras
        env:
          GILL_KEY: ${{ secrets.GILL_MAC14_CI_KEY }}
        shell: bash
        run: |
          set -eu
          node "$RUNNER_TEMP/key-probe/bootstrap.mjs" open "$RUNNER_TEMP/key-probe" 67025a9f7569bc8dbc0a3b9f77a75a54480b33eb5615ae4139c4f7ac34b927b7
          node "$RUNNER_TEMP/key-probe/extras-open.mjs" "$RUNNER_TEMP/key-probe" e63066aa91a4c8046d85c25be9c4140433fcaa3be38077bb77ebf7b6b59e717b 752d8b75f009271e09f030079fc241be7acfc0c9455c810bb000feee86a7d21d
      - name: Fresh account separate callers only
        env:
          CI: 'true'
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set +x
          node "$RUNNER_TEMP/key-probe/input/key-probe-ci/driver.mjs" "$TARGET_ARCH" "$RUNNER_TEMP/key-probe/output/evidence" > "$RUNNER_TEMP/key-probe/driver-private.log" 2>&1
      - name: Encrypt diagnostics including failure
        if: always()
        env:
          GILL_KEY: ${{ secrets.GILL_MAC14_CI_KEY }}
        shell: bash
        run: node "$RUNNER_TEMP/key-probe/finish.mjs" "$RUNNER_TEMP/key-probe"
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-key-probe-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/key-probe/result.gillenc
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
